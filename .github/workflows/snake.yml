name: Validate profile assets

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - scripts/**
      - .github/workflows/snake.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/**
      - .github/workflows/snake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check signature geometry, animation timing and README assets
        run: node --test scripts/profile.test.mjs
      - name: Check generated assets are up to date
        run: |
          node scripts/generate-commit-trail.mjs
          git diff --exit-code -- assets
