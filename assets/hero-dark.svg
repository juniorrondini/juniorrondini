<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title"><title id="title">Junior Rondini — animated neon signature</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}*{animation:none!important}}</style>
<defs>
