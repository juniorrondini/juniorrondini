<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-labelledby="title"><title id="title">Build something useful. Make something unexpected.</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}*{animation:none!important}}</style><defs><linearGradient id="line"><stop stop-color="#62f5b8"/><stop offset=".5" stop-color="#54d9ff"/><stop offset="1" stop-color="#bca8ff"/></linearGradient></defs><path d="M0 48C140 5 230 85 370 42S620 6 750 45S920 75 1000 38V132H0Z" fill="#111e30"/><path d="M0 48C140 5 230 85 370 42S620 6 750 45S920 75 1000 38" fill="none" stroke="url(#line)" stroke-width="1.5"/><path class="motion" d="M0 48C140 5 230 85 370 42S620 6 750 45S920 75 1000 38" fill="none" stroke="#eaf5ff" stroke-width="2" stroke-dasharray="70 1000"><animate attributeName="stroke-dashoffset" values="1070;-1070" dur="14s" repeatCount="indefinite"/></path><text x="500" y="102" font-size="19" fill="#eaf5ff" class="mono" text-anchor="middle" letter-spacing="1">BUILD SOMETHING USEFUL. MAKE SOMETHING UNEXPECTED.</text></svg>
